[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-hmm"
version = "0.1.0"
description = "Sampling and state tracking for HMM experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "pomegranate==1.1.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
